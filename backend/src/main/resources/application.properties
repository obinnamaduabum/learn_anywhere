quarkus.http.host=${APP_HOST:127.0.0.1}
quarkus.http.port=${APP_PORT:8080}
quarkus.http.limits.max-body-size=256K
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:learning}
quarkus.datasource.password=${POSTGRES_PASSWORD:local-dev-only}
quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/learning}
quarkus.datasource.jdbc.max-size=${DB_MAX_OPEN:10}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=${MIGRATE_AT_START:false}
%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.http.host=${APP_HOST:0.0.0.0}
quarkus.smallrye-openapi.open-api-version=3.0.3
quarkus.smallrye-openapi.info-title=Learn Anywhere API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=${SWAGGER_ENABLED:false}
learning.admin-token=${ADMIN_TOKEN:}

# Keep application documentation under the same versioned namespace.
quarkus.smallrye-openapi.path=/api/v1/openapi
quarkus.swagger-ui.path=/api/v1/swagger-ui

learning.openai-key=${OPENAI_API_KEY:}
learning.openai-model=${OPENAI_MODEL:}

# Optional learning companion; keep provider credentials on the backend.
learning.groq-key=${GROQ_API_KEY:}
learning.groq-model=${GROQ_MODEL:llama-3.3-70b-versatile}
